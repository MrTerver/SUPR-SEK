requests:
  folder: "data/local"
  source_file_pattern: "Главная Свод по выполнению*.xlsx"
  sheet_name: "СВОД"
  header_row: 3
  data_start_row: 5
  key_column: request_number

  columns:
    - source: "№ заявки"
      target: request_number
      column: "C"
      display: "№ заявки"
      type: text
      required: true

    - source: "Адрес объекта"
      target: object_address
      column: "J"
      display: "Адрес объекта"
      type: text

    - source: "Дата заявки"
      target: request_date
      column: "D"
      display: "Дата заявки"
      type: date

    - source: "Ответственный"
      target: responsible_contact
      column: "P"
      display: "Контакт ответственного"
      type: text

    - source: "Объем ППО"
      target: ppo_plan
      column: "X"
      display: "ППО"
      type: number

    - source: "Объем ТРП"
      target: trp_plan
      column: "Y"
      display: "ТРП"
      type: number

    - source: "Работы ППО"
      target: ppo_done
      column: "Z"
      display: "Выполнено ППО"
      type: number

    - source: "Работы ТРП"
      target: trp_done
      column: "AA"
      display: "Выполнено ТРП"
      type: number

    - source: "Поставка 1ф ПУ"
      target: pu1_supply
      column: "AB"
      display: "Поставка 1ф ПУ"
      type: number

    - source: "Поставка 3ф ПУ"
      target: pu3_supply
      column: "AC"
      display: "Поставка 3ф ПУ"
      type: number

    - source: "Поставка 3ф ПУ(ТТ)"
      target: pu3tt_supply
      column: "AD"
      display: "Поставка 3ф ПУ(ТТ)"
      type: number

    - source: "Поставка Шлюз"
      target: gateway_supply
      column: "AE"
      display: "Поставка Шлюз"
      type: number

    - source: "Поставка Роутер"
      target: router_supply
      column: "AF"
      display: "Поставка Роутер"
      type: number

    - source: "Объемы 1ф ПУ"
      target: pu1_plan
      column: "AG"
      display: "Объемы 1ф ПУ"
      type: number

    - source: "Объемы 3ф ПУ"
      target: pu3_plan
      column: "AH"
      display: "Объемы 3ф ПУ"
      type: number

    - source: "Объемы 3ф ПУ(ТТ)"
      target: pu3tt_plan
      column: "AI"
      display: "Объемы 3ф ПУ(ТТ)"
      type: number

    - source: "Объемы Шлюз"
      target: gateway_plan
      column: "AJ"
      display: "Объемы Шлюз"
      type: number

    - source: "Объемы Роутер"
      target: router_plan
      column: "AK"
      display: "Объемы Роутер"
      type: number

    - source: "Работы 1ф ПУ"
      target: pu1_done
      column: "AL"
      display: "Работы 1ф ПУ"
      type: number

    - source: "Работы 3ф ПУ"
      target: pu3_done
      column: "AN"
      display: "Работы 3ф ПУ"
      type: number

    - source: "Работы 3ф ПУ (ТТ)"
      target: pu3tt_done
      column: "AP"
      display: "Работы 3ф ПУ (ТТ)"
      type: number

    - source: "Работы Шлюз"
      target: gateway_done
      column: "AR"
      display: "Работы Шлюз"
      type: number

    - source: "Работы Роутер"
      target: router_done
      column: "AT"
      display: "Работы Роутер"
      type: number

    - source: "ПНР с СМР"
      target: pnr_with_smr_done
      column: "AV"
      display: "ПНР с СМР"
      type: number

    - source: "ПНР без СМР"
      target: pnr_done
      column: "AW"
      display: "ПНР без СМР"
      type: number

    - source: "опрос, %"
      target: poll_status
      column: "AX"
      display: "опрос, %"
      type: number